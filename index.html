
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#082f50">

  <title>ARTIMIS | آرتیمیس لوازم هنری</title>

  <meta name="description" content="کارت ویزیت دیجیتال فروشگاه آرتیمیس؛ فروشگاه لوازم هنری و ابزار نقاشی">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #082f50;
      --cream: #f4efdf;
      --purple: #6814df;
      --text: #17334a;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #eee9dc;
      color: var(--text);
      min-height: 100vh;
      padding: 25px 14px 35px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .business-card {
      background: var(--cream);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(8, 47, 80, 0.13);
    }

    /* تصویر اصلی ARTIMIS */

    .cover {
      display: block;
      width: 100%;
      height: auto;
    }

    /* لینک شبکه های اجتماعی */

    .social-links {
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      background: var(--cream);
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 58px;
      padding: 13px;
      background: var(--navy);
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      transition: 0.25s;
      box-shadow: 0 5px 12px rgba(8, 47, 80, 0.12);
    }

    .social-link:hover {
      background: #124c75;
      transform: translateY(-3px);
    }

    .social-link svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: white;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* تبلیغ QRcodino */

    .creator {
      text-align: center;
      padding: 20px 12px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
    }

    .creator-caption {
      color: #777;
      font-size: 12px;
    }

    .creator-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      text-decoration: none;
      color: var(--purple);
    }

    .creator-brand img {
      width: 65px;
      height: 65px;
      object-fit: contain;
    }

    .creator-name {
      font-size: 23px;
      font-weight: 900;
    }

    .creator-instagram {
      display: flex;
      align-items: center;
      gap: 7px;
      direction: ltr;
      color: var(--purple);
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .creator-instagram svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .footer-note {
      font-size: 11px;
      color: #888;
      padding-bottom: 5px;
    }

    @media (min-width: 600px) {
      .social-links {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .social-link {
        font-size: 13px;
        padding: 12px 5px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="business-card">

      <!-- تصویر اصلی و لوگوی ARTIMIS -->
      <img
        class="cover"
        src="images/artimis-cover.jpg"
        alt="ARTIMIS - آرتیمیس فروشگاه لوازم هنری"
      >

      <!-- لینک های ارتباطی -->
      <div class="social-links">

        <!-- Instagram -->
        <a
          class="social-link"
          href="https://www.instagram.com/artimis_shoop?vrfl=MTJrOXphYTFuYnNieg=="
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="18" cy="6" r="1" fill="white"/>
          </svg>
          <span>صفحه اینستاگرام</span>
        </a>

        <!-- Eitaa -->
        <a
          class="social-link"
          href="https://eitaa.com/Artimis_Shop"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24">
            <path d="M21 3L3 10.5l7 2.5L12.5 21 21 3Z"/>
            <path d="M10 13l11-10"/>
          </svg>
          <span>کانال ایتا</span>
        </a>

        <!-- Rubika -->
        <a
          class="social-link"
          href="https://rubika.ir/Artimis__Shop"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24">
            <path d="M12 3C6.5 3 3 6.7 3 11c0 2.1.9 4 2.5 5.3V21l4-2.1c.8.2 1.6.3 2.5.3 5.5 0 9-3.7 9-8.2S17.5 3 12 3Z"/>
          </svg>
          <span>کانال روبیکا</span>
        </a>

      </div>

    </section>

    <!-- معرفی سازنده کارت ویزیت دیجیتال -->

    <footer class="creator">

      <span class="creator-caption">
        طراحی و اجرای کارت ویزیت دیجیتال توسط
      </span>

      <a
        class="creator-brand"
        href="https://www.instagram.com/qrcodino?cplk=MWExMnNvZTdpbWU3aw=="
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="images/qrcodino.png"
          alt="لوگوی QRcodino"
        >

        <span class="creator-name">QRcodino</span>
      </a>

      <a
        class="creator-instagram"
        href="https://www.instagram.com/qrcodino?cplk=MWExMnNvZTdpbWU3aw=="
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="18" cy="6" r="1" fill="currentColor"/>
        </svg>

        <span>qrcodino</span>
      </a>

      <span class="footer-note">
        Digital Business Card
      </span>

    </footer>

  </main>

</body>
</html>
